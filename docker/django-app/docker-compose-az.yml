version: "3.9"
services:
  web:
    image: ghcr.io/ssc-sp/django-app:latest@sha256:52cb8613ad08c23ec0522cefd3407be7866026644f250d35b5aedeb235265c60
    ports:
      - "8000:8000"
    command: /bin/bash entry-point.sh
    volumes:
      - my_code:/code
    depends_on:
      - db
  db:
    image: docker.io/postgres:13@sha256:4689940c683801b4ab839ab3b0a0a3555a5fe425371422310944e89eca7d8068
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"

volumes:
  postgres_data:
  my_code:
