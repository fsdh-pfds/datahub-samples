version: "3.9"
services:
  web:
    build: .
    ports:
      - "8000:8000"
    command: /bin/bash entry-point.sh
    volumes:
      - .:/code
    depends_on:
      - db
  db:
    image: postgres:13@sha256:fb11a641ba92390de4f781dc6f7b315f5eacb0c2f5569f67959f76f1f80b49b1
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"

volumes:
  postgres_data:
